  <style>
    :root {
      --olive: #b7c86a;
      --olive-deep: #6e7d32;
      --olive-glow: rgba(183, 200, 106, 0.45);
      --red: #d32f2f;
      --sky: #7ec8e3;
      --ink: #0b1018;
      --glass: rgba(8, 12, 20, 0.72);
      --line: rgba(183, 200, 106, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Oswald", "Arial Narrow", sans-serif;
      color: #e8eed6;
      background: var(--ink);
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: -40px;
      background: url("assets/camo-bg.png") center / cover no-repeat;
      filter: blur(10px) saturate(0.85) brightness(0.42);
      transform: scale(1.08);
      z-index: 0;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.72) 100%),
        linear-gradient(180deg, rgba(5, 10, 16, 0.35), rgba(5, 10, 16, 0.55));
      pointer-events: none;
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 28px 16px 36px;
    }

    .card {
      width: min(640px, 100%);
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(18px) saturate(1.1);
      -webkit-backdrop-filter: blur(18px) saturate(1.1);
      padding: 36px 32px 28px;
      position: relative;
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .corner {
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: var(--olive);
      border-style: solid;
      pointer-events: none;
    }

    .corner-tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo {
      width: min(220px, 62vw);
      height: auto;
      display: block;
      mix-blend-mode: screen;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.45));
    }

    .rank-line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 4px 0 18px;
      color: var(--olive);
      letter-spacing: 0.28em;
      font-size: 11px;
      text-transform: uppercase;
    }

    .rank-line::before,
    .rank-line::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--olive), transparent);
      opacity: 0.55;
    }

    h1 {
      font-family: "Russo One", "Oswald", sans-serif;
      color: var(--olive);
      text-align: center;
      font-size: clamp(18px, 5vw, 34px);
      line-height: 1.15;
      letter-spacing: 0.03em;
      text-shadow: 0 0 22px var(--olive-glow);
      text-transform: uppercase;
      white-space: nowrap;
      min-height: 1.3em;
    }

    h1::after {
      content: "_";
      margin-left: 2px;
      color: var(--olive);
      animation: blink 0.85s step-end infinite;
    }

    .contacts {
      margin-top: 42px;
      text-align: center;
    }

    .name {
      font-family: "Russo One", "Oswald", sans-serif;
      color: var(--olive);
      font-size: clamp(18px, 4.2vw, 26px);
      line-height: 1.2;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .patronymic {
      display: block;
      margin-top: 4px;
      font-size: clamp(14px, 3.2vw, 18px);
      letter-spacing: 0.08em;
      color: #d5e08a;
      font-weight: 400;
    }

    .phone {
      display: block;
      margin-top: 12px;
      text-align: center;
      font-family: "Russo One", sans-serif;
      font-size: clamp(15px, 3.4vw, 18px);
      letter-spacing: 0.08em;
      color: var(--olive);
      text-decoration: none;
      text-shadow: 0 0 16px var(--olive-glow);
    }

    .phone:hover,
    .phone:focus-visible,
    .email:hover,
    .email:focus-visible {
      color: #d5e08a;
    }

    .email {
      display: block;
      margin-top: 8px;
      font-family: "Oswald", sans-serif;
      font-size: clamp(15px, 3.2vw, 18px);
      letter-spacing: 0.06em;
      color: var(--olive);
      text-decoration: none;
    }

    .map-block {
      margin-top: 28px;
    }

    .map-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .map-title {
      font-family: "Russo One", sans-serif;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--olive);
    }

    .address {
      font-size: 15px;
      letter-spacing: 0.04em;
      color: #dfe6c8;
    }

    .map-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      height: 230px;
      background: #10161f;
    }

    .map-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      filter: saturate(0.85) contrast(1.05);
    }

    .route {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 10px 14px;
      border: 1px solid var(--olive-deep);
      color: var(--olive);
      text-decoration: none;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 12px;
      transition: 0.2s ease;
      background: rgba(110, 125, 50, 0.12);
    }

    .route:hover,
    .route:focus-visible {
      background: rgba(183, 200, 106, 0.18);
      box-shadow: 0 0 18px var(--olive-glow);
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(232, 238, 214, 0.45);
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @media (max-width: 520px) {
      .card {
        padding: 28px 18px 22px;
      }

      .map-frame {
        height: 200px;
      }

      .route {
        width: 100%;
        justify-content: center;
      }
    }

<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main class="page">
    <section class="card">
      <span class="corner corner-tl"></span>
      <span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span>
      <span class="corner corner-br"></span>

      <div class="logo-wrap">
        <img class="logo" src="assets/logo-group9.png" alt="Логотип Военторг 77" />
      </div>

      <p class="rank-line">Военторг 77</p>

      <h1 id="typed" aria-live="polite"></h1>

      <div class="contacts">
        <p class="name">
          Хомидов
          <span class="patronymic">Александр Владимирович</span>
        </p>
        <a class="phone" href="tel:+79100027400">+7 910 002-74-00</a>
        <a class="email" href="mailto:voentorg77@yandex.ru">voentorg77@yandex.ru</a>
      </div>

      <div class="map-block">
        <div class="map-head">
          <div>
            <p class="map-title">Точка на карте</p>
            <p class="address">ул. Лечебная, 17, г. Москва</p>
          </div>
        </div>
        <div class="map-frame">
          <iframe
            title="Карта: улица Лечебная, 17, Москва"
            src="https://yandex.ru/map-widget/v1/?ll=37.74112%2C55.79118&z=16&pt=37.74112,55.79118,pm2rdm&l=map"
            loading="lazy"
            allowfullscreen
          ></iframe>
        </div>
        <a
          class="route"
          href="https://yandex.ru/maps/?text=%D0%9C%D0%BE%D1%81%D0%BA%D0%B2%D0%B0%2C%20%D1%83%D0%BB%D0%B8%D1%86%D0%B0%20%D0%9B%D0%B5%D1%87%D0%B5%D0%B1%D0%BD%D0%B0%D1%8F%2C%2017"
          target="_blank"
          rel="noopener noreferrer"
        >
          Открыть маршрут →
        </a>
      </div>

      <p class="footer">Москва · Соколиная Гора</p>
    </section>
  </main>

  <script>
    const text = "Военная экипировка";
    const el = document.getElementById("typed");
    let i = 0;
    let deleting = false;

    function tick() {
      el.textContent = text.slice(0, i);

      if (!deleting && i < text.length) {
        i += 1;
        setTimeout(tick, 70);
        return;
      }

      if (!deleting && i === text.length) {
        deleting = true;
        setTimeout(tick, 6000);
        return;
      }

      if (deleting && i > 0) {
        i -= 1;
        setTimeout(tick, 28);
        return;
      }

      deleting = false;
      setTimeout(tick, 450);
    }

    tick();
  </script>
</body>
